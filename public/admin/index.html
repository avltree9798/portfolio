<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>CV access · Anthony Viriya</title>
    <link rel="stylesheet" href="/admin/style.css" />
    <script src="/admin/app.js" defer></script>
  </head>
  <body>
    <main>
      <a href="/">← Portfolio</a>
      <p class="eyebrow">OWNER ACCESS</p>
      <h1>Share my CV.</h1>
      <p>Create an expiring download link for someone you choose.</p>
      <form id="login" hidden>
        <label for="password">Owner password</label
        ><input
          id="password"
          type="password"
          autocomplete="current-password"
          required
          maxlength="256"
        /><button>Sign in</button>
      </form>
      <section id="sharing" hidden>
        <form id="generate">
          <label for="expiry">Link expires after</label
          ><select id="expiry">
            <option value="3600">1 hour</option>
            <option value="86400" selected>1 day</option>
            <option value="604800">7 days</option></select
          ><button>Generate download link</button>
        </form>
        <div id="result" hidden>
          <label for="link">Private download link</label
          ><input id="link" readonly />
          <p id="expires"></p>
          <button id="copy" type="button">Copy link</button>
          <p>
            Anyone with this link can download your CV until it expires. They
            can keep a copy after downloading it.
          </p>
        </div>
        <button id="logout" type="button" class="secondary">Sign out</button>
      </section>
      <p id="status" role="status" aria-live="polite">Checking sign-in…</p>
    </main>
  </body>
</html>
